          type: string
        versionId:
          type: string
        source:
          type: string
          enum: [local, stdin]
        repository:
          type: string
        branch:
          type: string
        head:
          type: [string, "null"]
        revision:
          type: string
        file:
          type: object
          additionalProperties: false
          required: [status, oldPath]
          properties:
            status:
              type: string
            oldPath:
              type: [string, "null"]
    ReviewComment:
      type: object
      additionalProperties: false
      if:
        required: [target]
        properties:
          target:
            const: file
      then:
        properties:
          side:
            const: additions
          start:
            const: 0
          end:
            const: 0
          code:
            const: ""
      else:
        properties:
          start:
            minimum: 1
          end:
            minimum: 1
      required:
        [
          id,
          diffId,
          versionId,
          path,
          scope,
          fingerprint,
          side,
          start,
          end,
          code,
          body,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
        diffId:
          type: string
        versionId:
          type: string
        path:
          type: string
        scope:
          $ref: "#/components/schemas/DiffMode"
        fingerprint:
          type: string
        target:
          type: string
          enum: [file, lines]
          description: Omitted means a line comment. File comments use additions, zero start/end, and empty code.
        side:
          type: string
          enum: [additions, deletions]
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        code:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [open, resolved]
        createdAt:
          type: number
        origin:
          $ref: "#/components/schemas/ReviewOrigin"
    AgentReviewComment:
