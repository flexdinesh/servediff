        path:
          type: string
        oldPath:
          type: [string, "null"]
        status:
          type: string
        indexStatus:
          type: string
        worktreeStatus:
          type: string
        additions:
          type: integer
        deletions:
          type: integer
        binary:
          type: boolean
        fingerprint:
          type: string
        recreated:
          type: boolean
    RepositoryDiff:
      type: object
      additionalProperties: false
      required:
        [
          id,
          versionId,
          locationId,
          repositoryId,
          source,
          root,
          name,
          branch,
          head,
          mode,
          files,
          revision,
        ]
      properties:
        id:
          type: string
        versionId:
          type: string
        locationId:
          type: [string, "null"]
        repositoryId:
          type: [string, "null"]
        source:
          type: string
          enum: [local, stdin]
        root:
          type: string
        name:
          type: string
        branch:
          type: string
        head:
          type: [string, "null"]
        mode:
          $ref: "#/components/schemas/DiffMode"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChangedFile"
        revision:
          type: string
    FilePatch:
      type: object
      additionalProperties: false
      required: [patch, message]
      properties:
        patch:
          type: string
        message:
          type: [string, "null"]
        contents:
          $ref: "#/components/schemas/FileContents"
    FileContents:
