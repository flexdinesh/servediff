name: Release dev

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Resolve main when the run starts so queued runs cannot publish older commits.
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish dev branch
        run: git push --force-with-lease origin HEAD:refs/heads/dev
