name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:static
      - run: test -z "$(gofmt -l cmd internal packages/api tools test/conformance)"
      - run: go vet ./...
      - run: pnpm build
      - run: go run ./tools/stage-web apps/web/dist internal/webui/dist
      - run: test -z "$(git status --porcelain --untracked-files=all -- packages/api/src/schema.d.ts internal/webui/dist)"
      - run: mkdir -p dist && go build -trimpath -o dist/servediff ./cmd/servediff
      - run: pnpm test:conformance
