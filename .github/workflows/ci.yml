name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-dependencies-${{ hashFiles('mise.toml', '.node-version', 'package.json', 'pnpm-lock.yaml', 'go.sum') }}
          restore-keys: ${{ runner.os }}-dependencies-
      - run: pnpm install --frozen-lockfile
      - run: mise run check:ci
