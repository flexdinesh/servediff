version: 2

release:
  prerelease: false
  make_latest: true

before:
  hooks:
    - pnpm install --frozen-lockfile
    - mise run web:stage

builds:
  - id: servediff
    main: ./cmd/servediff
    binary: servediff
    env:
      - CGO_ENABLED=0
    ldflags:
      - >-
        -s -w
        -X github.com/flexdinesh/servediff/internal/version.Version={{.Version}}
        -X github.com/flexdinesh/servediff/internal/version.Commit={{.Commit}}
        -X github.com/flexdinesh/servediff/internal/version.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
