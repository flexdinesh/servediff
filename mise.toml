[settings]
# Reuse .node-version and package.json's packageManager pin.
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tools]
go = "1.25.14"

[tasks.setup]
description = "Install dependencies, hooks, and Playwright Chromium"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm prepare",
  "pnpm test:browser:install",
]

[tasks.generate]
description = "Generate TypeScript API types"
run = "pnpm generate:api"

[tasks."web:build"]
description = "Generate API types and build the web app"
run = "pnpm build"

[tasks."web:stage"]
description = "Build and stage embedded web assets"
depends = ["web:build"]
run = "go run ./tools/stage-web apps/web/dist internal/webui/dist"

[tasks.build]
description = "Build the standalone CLI at dist/servediff"
depends = ["web:stage"]
run = [
  "node -e \"require('node:fs').mkdirSync('dist', { recursive: true })\"",
  "go build -trimpath -o dist/servediff ./cmd/servediff",
  "go build -trimpath -o dist/servediff-server ./cmd/servediff-server",
]

[tasks.install]
description = "Build and install the CLI, removing legacy Node shims"
depends = ["build"]
shell = "bash -e -o pipefail -c"
run = '''
if [ "$(pnpm list --global --depth 0 --parseable servediff-workspace | wc -l)" -gt 1 ]; then
  pnpm remove --global servediff-workspace
fi
go run ./tools/remove-legacy-install
go install -trimpath ./cmd/servediff
'''

[tasks.dev]
description = "Start Vite HMR and its managed Go fixture server"
alias = "dev:web"
run = "pnpm dev:web"

[tasks."plugins:build"]
description = "Build self-contained agent plugin adapters"
run = "pnpm --recursive --filter '@servediff/plugin-*' --if-present build"

[tasks."plugins:install"]
description = "Install local agent plugins (--host codex|claude|opencode|pi|all)"
depends = ["build", "plugins:build"]
run = "go run ./tools/install-plugins install"

[tasks."plugins:remove"]
description = "Remove managed local agent plugins (--host NAME)"
run = "go run ./tools/install-plugins remove"

[tasks."dev:server"]
description = "Start a standalone Go fixture server"
depends = ["web:build"]
run = "go run ./cmd/servediff serve --fixture test/fixtures/sample.diff --state memory --web-dir apps/web/dist"

[tasks."test:go"]
description = "Run Go tests"
run = "pnpm test:go"

[tasks."test:race"]
description = "Run Go race tests (requires a C compiler)"
run = "go test -race ./..."

[tasks."test:conformance"]
description = "Build the CLI and smoke-test its API contract"
depends = ["build"]
run = "pnpm test:conformance"

[tasks."check:static"]
description = "Check TypeScript, JavaScript lint, and formatting"
run = ["mise tasks validate", "pnpm check:static"]

[tasks."check:go:static"]
description = "Check Go formatting and vet"
shell = "bash -e -o pipefail -c"
run = '''
unformatted=$(gofmt -l cmd internal packages/api tools test/conformance)
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
go vet ./...
'''

[tasks."check:go"]
description = "Check Go formatting, vet, and tests"
run = [{ task = "check:go:static" }, { task = "test:go" }]

[tasks."check:js"]
description = "Run JavaScript checks, build, and test suites"
run = "pnpm check:js"

[tasks."check:generated"]
description = "Reject uncommitted generated API types and embedded assets"
shell = "bash -e -o pipefail -c"
run = '''
generated_changes=$(git status --porcelain --untracked-files=all -- packages/api/src/schema.d.ts internal/webui/dist)
if [ -n "$generated_changes" ]; then
  printf '%s\n' "$generated_changes"
  echo 'Commit generated API types and embedded web assets before pushing.' >&2
  exit 1
fi
'''

[tasks."check:ci"]
description = "Lightweight CI: static checks, build, generated drift, API smoke test"
run = [
  { tasks = [
    "check:static",
    "check:go:static",
  ] },
  { task = "build" },
  { task = "check:generated" },
  "pnpm test:conformance",
]

[tasks.check]
description = "Run all repository checks and test suites"
run = [
  { task = "check:ci" },
  "pnpm test",
  "pnpm test:release",
  { task = "test:go" },
]

[tasks."check:push"]
description = "Full pre-push checks, race tests, and generated-file consistency"
run = [{ task = "check" }, { task = "test:race" }, { task = "check:generated" }]

[tasks."release:publish"]
description = "Publish the tagged GitHub release with GoReleaser"
tools = { "aqua:goreleaser/goreleaser" = "2.18.2" }
run = "goreleaser release --clean"

[tasks."release:homebrew:check"]
description = "Validate the generated Homebrew formula syntax"
run = "ruby -c homebrew-tap/Formula/servediff.rb"
