version: "3"

tasks:
  generate:
    cmds:
      - pnpm generate:api

  web:build:
    cmds:
      - pnpm --filter @servediff/web build

  web:stage:
    deps: [web:build]
    cmds:
      - go run ./tools/stage-web apps/web/dist internal/webui/dist

  build:
    cmds:
      - task: generate
      - task: web:stage
      - mkdir -p dist
      - go build -trimpath -o dist/servediff ./cmd/servediff

  install:
    cmds:
      - task: build
      - |
        if [ "$(pnpm list --global --depth 0 --parseable servediff-workspace | wc -l)" -gt 1 ]; then
          pnpm remove --global servediff-workspace
        fi
      - go run ./tools/remove-legacy-install
      - go install -trimpath ./cmd/servediff

  dev:web:
    cmds:
      - pnpm dev:web

  dev:server:
    deps: [web:build]
    cmds:
      - go run ./cmd/servediff --fixture test/fixtures/sample.diff --state memory --web-dir apps/web/dist

  dev:
    cmds:
      - task: dev:web

  test:go:
    cmds:
      - go test ./...

  test:conformance:
    cmds:
      - task: build
      - pnpm test:conformance

  check:go:
    cmds:
      - test -z "$(gofmt -l cmd internal packages/api tools)"
      - go vet ./...
      - go test ./...

  check:js:
    cmds:
      - pnpm check:js

  check:
    cmds:
      - task: check:js
      - task: check:go
      - task: test:conformance
